workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

studio-api-check:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore NexusStudio.slnx
    - dotnet build NexusStudio.slnx --no-restore
    - dotnet test apps/studio-api-tests/StudioApi.Tests.csproj --no-build

studio-web-check:
  stage: verify
  image: node:20
  script:
    - cd apps/studio-web
    - npm ci
    # APIの型（openapi/studio-api.json から生成）が最新であること。文書自体の最新性は studio-api-check のテストで確認する。
    - npm run gen:api
    - git diff --exit-code -- src/api/schema.d.ts
    - npm run typecheck
    - npm run lint
    - npm run build
