workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package

studio-api-check:
  stage: verify
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - dotnet restore NexusStudio.slnx
    - dotnet build NexusStudio.slnx --no-restore
    - dotnet test apps/studio-api-tests/StudioApi.Tests.csproj --no-build

studio-web-check:
  stage: verify
  image: node:20
  script:
    - cd apps/studio-web
    - npm ci
    - npm run typecheck
    - npm run build

studio-static-caddy-check:
  stage: verify
  image:
    name: caddy:2-alpine
    entrypoint: [""]
  script:
    - caddy validate --config apps/studio-web/Caddyfile --adapter caddyfile

.image-build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  artifacts:
    paths: [image-digests/]
    expire_in: 30 days

studio-api-image:
  extends: .image-build
  script:
    - sh deploy/build-image.sh studio-api apps/studio-api/Dockerfile

studio-web-image:
  extends: .image-build
  script:
    - sh deploy/build-image.sh studio-web apps/studio-web/Dockerfile
